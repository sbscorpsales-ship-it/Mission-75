name: WALKON
options:
  bundleIdPrefix: com.paramitsolutions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  WALKON:
    type: application
    platform: iOS
    sources:
      - path: WALKON
    info:
      path: WALKON/Info.plist
    entitlements:
      path: WALKON/WALKON.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paramitsolutions.walkon
        PRODUCT_NAME: WALKON
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: WALKON/WALKON.entitlements
        SUPPORTS_MACCATALYST: NO
    scheme:
      gatherCoverageData: false
