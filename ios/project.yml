name: WALKON
options:
  bundleIdPrefix: com.paramitsolutions
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  WALKON:
    type: application
    platform: iOS
    sources:
      - path: WALKON
    info:
      path: WALKON/Info.plist
    entitlements:
      path: WALKON/WALKON.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paramitsolutions.walkon
        PRODUCT_NAME: WALKON
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "WALKON reads your daily step count from Apple Health to show your activity progress."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "WALKON saves walking workouts and their recorded routes to Apple Health when you choose to do so."
        INFOPLIST_KEY_NSMotionUsageDescription: "WALKON uses motion sensors to measure steps during a walk you start, when supported."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "WALKON records your walking route only during an activity you start, including while the screen is locked."
        INFOPLIST_KEY_UIBackgroundModes: "location"
        CODE_SIGN_ENTITLEMENTS: WALKON/WALKON.entitlements
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - WALKONTests
      gatherCoverageData: false
  WALKONTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WALKONTests
    dependencies:
      - target: WALKON
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paramitsolutions.walkon.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
