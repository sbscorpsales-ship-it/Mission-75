name: GATIVX iOS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/GATIVX/**"
      - "ios/GATIVXTests/**"
      - "ios/GATIVXUITests/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"
  push:
    branches:
      - main
      - "fix/gativx/**"
      - "fix/gativx-*"
    paths:
      - "ios/GATIVX/**"
      - "ios/GATIVXTests/**"
      - "ios/GATIVXUITests/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"

permissions:
  contents: read

# Run one validation per source branch across push and pull-request events.
# A newer commit supersedes the older run; the extended job timeout protects the full pipeline.
concurrency:
  group: gativx-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26-intel
    # UI tests and both simulator/device builds can exceed 20 minutes on hosted macOS.
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate GATIVX project
        run: xcodegen generate --spec ios/gativx-project.yml --project ios

      - name: Validate project and scheme
        run: xcodebuild -list -project ios/GATIVX.xcodeproj

      - name: Verify GATIVX first-run auth, portrait layout and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re

          cloud = Path("ios/GATIVX/Cloud/SupabaseRESTClient.swift").read_text()
          view = Path("ios/GATIVX/ContentView.swift").read_text()
          spec = Path("ios/gativx-project.yml").read_text()
          with Path("ios/GATIVX/Info.plist").open("rb") as stream:
              info = plistlib.load(stream)

          key_match = re.search(r'private let publishableKey = "([^"]+)"', cloud)
          assert key_match, "Supabase publishable key is missing"
          assert key_match.group(1).startswith("sb_publishable_"), "Mobile app must use a publishable key"
          assert "sb_secret_" not in cloud and "service_role" not in cloud, "A privileged Supabase key must never ship in the app"
          assert "https://crarbbsvcczwmtvxyrxo.supabase.co" in cloud, "Supabase project URL changed unexpectedly"
          assert "auth/v1/signup" in cloud and "auth/v1/token" in cloud, "Sign-up and password sign-in endpoints must both exist"
          assert "await cloud.signUp(email: cleanEmail, password: password)" in view, "Optional account registration action is not connected"
          assert "await cloud.signIn(email: cleanEmail, password: password)" in view, "Optional account sign-in action is not connected"
          assert 'Section("Account")' in view and 'Button("Sign out", role: .destructive)' in view, "Account management must remain available in Profile"
          assert "An account is optional." in view, "Dashboard must remain usable without an account"
          root_start = view.index("    var body: some View {", view.index("private var welcomeScreen"))
          root_end = view.index(".frame(maxWidth: .infinity, maxHeight: .infinity)", root_start)
          launch_root = view[root_start:root_end]
          assert "TabView(selection: $selectedTab)" in launch_root, "Tapping the app icon must open the dashboard tab shell directly"
          assert "homeDashboard" in launch_root, "The approved home dashboard must be the initial app screen"
          assert "welcomeScreen" not in launch_root and "if cloud.isSignedIn" not in launch_root, "First launch must not be blocked by welcome or account registration"
          assert 'accessibilityIdentifier("gativx-home-dashboard")' in view, "Dashboard needs a stable test identifier"
          assert "GATIVX GURU" in view and "GATIVX Guru" in view, "GATIVX Guru branding must remain available in dashboard and navigation"
          dashboard = view.split("private var homeDashboard: some View", 1)[1].split("private func wellnessSnapshotCard", 1)[0]
          assert 'Text("GATI GURU")' in dashboard, "Approved home dashboard must show the Gati Guru section"
          assert 'Image(systemName: "bell.badge")' in dashboard, "Approved dashboard header must include the notification bell"
          assert 'Image(systemName: "person.crop.circle.fill")' in dashboard, "Approved dashboard header must include the member profile image"
          approved_sections = ["TODAY'S STEPS", "TODAY'S MISSION", 'wellnessSnapshotCard("Distance"', 'wellnessSnapshotCard("Active time"', 'wellnessSnapshotCard("Calories"', 'wellnessSnapshotCard("Avg. heart rate"', "ACTIVITY TRACKER", "START WALK", "GATI GURU", "MY JOURNEY", "COMMUNITY GATI"]
          section_positions = [dashboard.index(section) for section in approved_sections]
          assert section_positions == sorted(section_positions), "Dashboard sections must retain the approved order"
          assert dashboard.count("wellnessSnapshotCard(") == 4, "Dashboard must show exactly four approved health metrics"
          assert dashboard.count(".tabItem { Label(") == 0, "Navigation tabs belong to the persistent app shell, not the scrollable dashboard"
          step_ring = view.split("private var stepRing: some View", 1)[1].split("private var homeDashboard", 1)[0]
          assert ".frame(width: 190, height: 190)" not in step_ring, "Step ring must respect its responsive dashboard container"
          assert "let ringDiameter = min(max(dashboardWidth * 0.40, 136), 164)" in view, "Dashboard must size the step ring responsively for iPhone width"
          assert "stepRing.frame(width: ringDiameter, height: ringDiameter)" in view, "Step ring must use the responsive dashboard size"
          assert "GeometryReader { dashboardGeometry in" in view and ".frame(height: heroHeight)" in view, "Dashboard hero and spacing must adapt to available screen dimensions"
          assert "motionMonitoringEnabled" in view and "if motionMonitoringEnabled { startLiveMotionMonitor() }" in view, "Daily motion tracking must be opt-in, not prompted at launch"

          required_usage = [
              "NSHealthShareUsageDescription",
              "NSHealthUpdateUsageDescription",
              "NSMotionUsageDescription",
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ]
          for key in required_usage:
              assert isinstance(info.get(key), str) and info[key].strip(), f"Missing privacy usage description: {key}"
          assert "location" in info.get("UIBackgroundModes", []), "Background location mode is missing"
          assert info.get("UISupportedInterfaceOrientations") == ["UIInterfaceOrientationPortrait"], "GATIVX must stay in portrait on iPhone"
          assert "UIInterfaceOrientationPortrait" in spec, "XcodeGen spec must retain portrait-only orientation"
          assert "NSContactsUsageDescription" not in info and "CNContactStore" not in view, "Do not request Contacts for core fitness features"

          print("PASS: publishable Supabase configuration and both auth endpoints")
          print("PASS: direct dashboard launch with optional account setup in Profile")
          print("PASS: opt-in Motion permission and portrait-only native layout")
          print("PASS: HealthKit, Motion and GPS usage descriptions")
          print("PASS: no unnecessary Contacts permission")
          PY

      - name: Run GATIVX unit tests
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")), ""))')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            exit 1
          fi
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/GATIVX-Tests \
            -resultBundlePath build/GATIVX.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload XCTest result bundle and dashboard screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-xcresult
          path: build/GATIVX.xcresult
          if-no-files-found: warn

      - name: Verify generated target references HealthKit source entitlements
        run: |
          SETTINGS="$(xcodebuild -showBuildSettings -project ios/GATIVX.xcodeproj -scheme GATIVX)"
          echo "$SETTINGS" | grep -F 'CODE_SIGN_ENTITLEMENTS = GATIVX/GATIVX.entitlements'
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          spec = Path("ios/gativx-project.yml").read_text()
          if "CODE_SIGN_ENTITLEMENTS: GATIVX/GATIVX.entitlements" not in spec:
              raise SystemExit("Generated GATIVX target is not configured with HealthKit entitlements")
          with Path("ios/GATIVX/GATIVX.entitlements").open("rb") as stream:
              entitlements = plistlib.load(stream)
          if entitlements.get("com.apple.developer.healthkit") is not True:
              raise SystemExit("HealthKit entitlement missing")
          if entitlements.get("com.apple.developer.healthkit.background-delivery") is not True:
              raise SystemExit("HealthKit background-delivery entitlement missing")
          print("HealthKit source entitlement configuration verified; device signing remains a separate gate.")
          PY

      - name: Verify real-time tracking safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gps = Path("ios/GATIVX/GPSRouteRecorder.swift").read_text()
          activity_store = Path("ios/GATIVX/Storage/ActivitySessionStore.swift").read_text()
          archive_store = Path("ios/GATIVX/Storage/RunJeetDailyStepsArchiveStore.swift").read_text()
          archive_tests = Path("ios/GATIVXTests/RunJeetBackupImporterTests.swift").read_text()
          activity_model = Path("ios/GATIVX/Models/ActivitySessionRecord.swift").read_text()
          view = Path("ios/GATIVX/ContentView.swift").read_text()
          health = Path("ios/GATIVX/HealthKit/HealthKitManager.swift").read_text()
          cloud = Path("ios/GATIVX/Cloud/SupabaseRESTClient.swift").read_text()
          migration = Path("supabase/migrations/20261109113101_allow_gps_route_sync_without_step_count.sql").read_text()
          outbox = cloud.split("enum PendingHealthSyncKind", 1)[1] if "enum PendingHealthSyncKind" in cloud else ""
          activity_outbox = cloud.split("struct PendingActivitySession", 1)[1] if "struct PendingActivitySession" in cloud else ""
          activity_retry = cloud.split("func retryPendingActivitySessions()", 1)[1].split("func signIn", 1)[0] if "func retryPendingActivitySessions()" in cloud else ""
          step_sync = cloud.split("func syncSteps(date: Date, steps: Int, pendingItem:", 1)[1].split("func syncActiveEnergy", 1)[0]
          energy_sync = cloud.split("func syncActiveEnergy", 1)[1].split("func syncMotionDailySteps", 1)[0]
          motion_sync = cloud.split("func syncMotionDailySteps", 1)[1].split("private func performStepSync", 1)[0]
          start_activity = view.split("private func startActivitySession()", 1)[1].split("private func finishActivitySession()", 1)[0]
          daily_display = view.split("private var displayedDailySteps", 1)[1].split("private var displayedStepSource", 1)[0]
          motion_monitor = view.split("private func startLiveMotionMonitor()", 1)[1].split("private func loadActivityHistory()", 1)[0]
          finish_activity = view.split("private func finishActivitySession()", 1)[1].split("/// Prefer HealthKit", 1)[0]
          auth_handler = gps.split("func locationManagerDidChangeAuthorization", 1)[1].split("func locationManager(", 1)[0]
          workout_export = health.split("func saveActivityWorkout(", 1)[1].split("func disconnect()", 1)[0]
          duplicate_check = workout_export.find("if samples?.isEmpty == false")
          first_workout_ack = workout_export.find("self.acknowledgeWorkout(id)")
          finish_workout = workout_export.find("builder.finishWorkout")
          confirmed_save = workout_export.find("else if workout != nil")
          second_workout_ack = workout_export.find("self.acknowledgeWorkout(id)", first_workout_ack + 1)
          confirmed_save_completion = workout_export.find("completion(.success(()))", confirmed_save)

          checks = {
              "Native daily total falls back to the live iPhone pedometer": "health.todaySteps ?? liveMotionSteps" in daily_display,
              "Starting a walk never fabricates a zero-step reading": "sessionSteps = 0" not in start_activity and "self.sessionSteps = data?.numberOfSteps.intValue" in start_activity,
              "Core Motion authorization state is surfaced": "CMPedometer.authorizationStatus()" in motion_monitor and "Motion & Fitness access is denied" in motion_monitor,
              "Core Motion sensor errors are not silently discarded": "iPhone pedometer error:" in motion_monitor,
              "Core Motion live daily steps remain a separate sensor source": "self.liveMotionSteps = steps" in motion_monitor and "syncMotionDailySteps" in motion_monitor,
              "GPS activity starts even without pedometer": "routeRecorder.start(activity: selectedActivity, ownerID: cloud.authenticatedUserID)" in start_activity and start_activity.index("routeRecorder.start(activity: selectedActivity, ownerID: cloud.authenticatedUserID)") < start_activity.index("guard CMPedometer.isStepCountingAvailable()"),
              "GPS-only activity button remains enabled without pedometer": 'Button { startActivitySession() } label:' in view and ".disabled(!CMPedometer.isStepCountingAvailable())" not in view,
              "GPS route is saved when pedometer is unavailable": "saveRecord(nil, nil)" in finish_activity or "saveRecord(nil,nil)" in finish_activity and "routePoints: routePoints" in finish_activity,
              "Workout finish rejects duplicate in-flight taps": "guard !isFinishingSession, let start = sessionStarted else { return }" in finish_activity,
              "Workout finish reconciles by stable session ID before clearing the recovered GPS draft": "let recordID = routeRecorder.activitySessionID ?? activeSessionID ?? UUID()" in finish_activity and "id: recordID" in finish_activity and "history = self.activityStore.upserting(record, into: history)" in finish_activity and "persistedHistory.contains(where: { $0.id == recordID })" in finish_activity and "func upserting(_ record: ActivitySessionRecord" in activity_store and "updated[index] = updated[index].mergingRecovery(record)" in activity_store,
              "Workout finish button is disabled while saving": ".disabled(isFinishingSession)" in view and "Saving activity…" in view,
              "Failed local save leaves the session retryable": "tap Finish & save activity to retry" in finish_activity and "self.sessionStarted = start" in finish_activity,
              "Sensor-empty activity is retained for retry rather than discarded": "Your session remains available" in finish_activity and "self.sessionStarted = nil" not in finish_activity.split("guard finalSteps != nil || !routePoints.isEmpty else", 1)[1].split("}", 1)[0] and "self.routeRecorder.clearDraft()" not in finish_activity.split("guard finalSteps != nil || !routePoints.isEmpty else", 1)[1].split("}", 1)[0],
              "Sensor-empty Finish & Save resumes the durable GPS draft for retry": "self.routeRecorder.resumeRecovered()" in finish_activity and "Your session remains available" in finish_activity,
              "Cloud activity sync reports corrupt local history instead of treating it as empty": "Cloud sync paused: saved activity history could not be read" in view and "try activityStore.load()" in view,
              "Completed activity is atomically stored and read back before GPS draft clearing": "try self.activityStore.save(history)" in finish_activity and "let persistedHistory = try self.activityStore.load()" in finish_activity and finish_activity.index("try self.activityStore.save(history)") < finish_activity.index("let persistedHistory = try self.activityStore.load()") < finish_activity.index("self.routeRecorder.clearDraft()"),
              "Local activity is decoded and verified before GPS draft clearing": "let persistedHistory = try self.activityStore.load()" in finish_activity and "persistedHistory.contains(where: { $0.id == recordID })" in finish_activity and finish_activity.index("persistedHistory.contains") < finish_activity.index("self.routeRecorder.clearDraft()"),
              "Activity history uses atomic Application Support file writes": "applicationSupportDirectory" in activity_store and "data.write(to: url, options: .atomic)" in activity_store,
              "Activity history file is read back and decoded before success": "let savedData = try Data(contentsOf: url)" in activity_store and "JSONDecoder().decode([ActivitySessionRecord].self, from: savedData)" in activity_store and "savedRecords.map(\\.id) == records.map(\\.id)" in activity_store,
              "Legacy history is removed only after verified file migration": "try write(records, to: url)" in activity_store and activity_store.index("try write(records, to: url)") < activity_store.index("userDefaults.removeObject(forKey: legacyKey)"),
              "Corrupt activity history is never overwritten with an empty list": "Could not read existing activity history" in finish_activity and "try self.activityStore.load()" in finish_activity,
              "Failed local activity save preserves GPS draft": "Your GPS draft remains preserved" in finish_activity and "catch {" in finish_activity,
              "Always permission enables background GPS during an active walk": "else if isRecording" in auth_handler and "manager.allowsBackgroundLocationUpdates = true" in auth_handler and "manager.showsBackgroundLocationIndicator = true" in auth_handler,
              "Active GPS updates resume after permission change": "manager.startUpdatingLocation()" in auth_handler,
              "Location downgrade removes background GPS claim": "manager.allowsBackgroundLocationUpdates = false" in auth_handler and "Allow Always location for background recording" in auth_handler,
              "GPS accuracy filter": "location.horizontalAccuracy <= 50" in gps,
              "GPS long-gap segmentation": "elapsed > 30" in gps,
              "GPS jump/speed rejection": "delta > 150 || speed > 8" in gps,
              "Backward-compatible route draft decoding": "decodeIfPresent(Bool.self, forKey: .breakBefore) ?? false" in gps,
              "iPhone GPS draft uses atomic Application Support file writes": "applicationSupportDirectory" in gps and "data.write(to: url, options: .atomic)" in gps,
              "GPS route persistence failure is not overwritten by recording success": "if persistDraft() {" in gps and gps.index("if persistDraft() {") < gps.index("Recording GPS route ·") and "GPS is recording, but the route draft is not safely stored" in gps,
              "Legacy UserDefaults GPS drafts migrate only after file write succeeds": "if fileData == nil, let legacyData, let url" in gps and "userDefaults.removeObject(forKey: draftKey)" in gps,
              "Unreadable iPhone GPS draft is preserved rather than silently discarded": "original data was preserved for recovery" in gps,
              "Unreadable GPS draft blocks new walks and remains preserved": "hasUnreadableDraft = true" in gps and "guard !isRecording, activeStartedAt == nil, !hasUnreadableDraft" in gps and "routeRecorder.hasUnreadableDraft" in start_activity and "RECOVERY NEEDED" in view and "routeRecorder.hasUnreadableDraft ? routeRecorder.status" in view,
              "Route distance skips segment breaks": "!pair.1.breakBefore" in gps,
              "Cloud distance skips segment breaks": "if cloudPoints[index].breakBefore { continue }" in cloud,
              "Live GPS map uses a writable camera binding": "Map(position: $routeMapCameraPosition)" in view and ".constant(.region(routeMapRegion))" not in view,
              "Live GPS map frames recovered and incoming route points": ".onAppear {" in view and ".onChange(of: routeRecorder.points.count)" in view and "routeMapCameraPosition = .region(routeMapRegion)" in view,
              "Active walk keeps motion monitor in background": "sessionStarted == nil && !routeRecorder.isRecording" in view,
              "Prompt HealthKit background update requested": "frequency: .immediate" in health,
              "Disconnect disables background delivery for every observed HealthKit quantity": "for type in [stepType, energyType, distanceType, exerciseType, heartRateType]" in health and "disableBackgroundDelivery(for: type)" in health,
              "HealthKit step background cadence disclosed as hourly": "at most hourly" in health,
              "Apple Health imports daily step history, not only today's total": "HKStatisticsCollectionQuery" in health and "enumerateStatistics(from: start, to: end)" in health,
              "Apple Health history window is bounded to a safe range": "max(1, min(days, 365))" in health,
              "Missing HealthKit days are not fabricated as zero": "guard let quantity = statistics.sumQuantity() else { return }" in health,
              "Apple Health workout export omits unavailable steps instead of inventing zero": '"com.paramitsolutions.gativx.measuredSteps"] = steps' in health and "steps ?? 0" not in health and "max(0, steps" not in health,
              "Apple Health export requests workout read access for sync-ID duplicate checks": "let readTypes: Set<HKObjectType> = [self.stepType, self.energyType, workoutType]" in health and "read: readTypes" in health and "HKMetadataKeySyncIdentifier" in health,
              "Apple Health workout export is durably queued before network or HealthKit work": "enqueueWorkout(pending)" in health and "workout-export-outbox.v1" in health,
              "Apple Health export queue is read-back verified": "verified.map(\\.id) == items.map(\\.id)" in health,
              "Apple Health export queue retains unreadable data": "Pending exports are unknown; original data was preserved" in health,
              "Apple Health workout export is acknowledged only after duplicate check or confirmed save": duplicate_check >= 0 and duplicate_check < first_workout_ack < finish_workout < confirmed_save < second_workout_ack < confirmed_save_completion,
              "Apple Health workout export retries are available on foreground": "retryPendingWorkoutExports()" in view,
              "HealthKit refresh clears stale today's value before querying": "self.todaySteps = nil" in health,
              "Daily distance, exercise and heart-rate refresh clears stale values before querying": "todayWalkingRunningDistanceKm = nil" in health and "todayExerciseMinutes = nil" in health and "todayAverageHeartRateBPM = nil" in health,
              "Active-energy query requires explicit HealthKit connection": "guard UserDefaults.standard.bool(forKey: connectionRequestedKey), isAvailable else" in health,
              "GPS route upload allows unknown steps without inventing zero": '"p_steps": steps.map { $0 as Any } ?? NSNull()' in cloud,
              "Sensor retry outbox is persisted on device": "healthOutboxKey" in cloud and "UserDefaults.standard.set(data, forKey: healthOutboxKey)" in cloud,
              "Sensor outbox writes are read-back verified": "saved == data" in cloud and "verified.count == items.count" in cloud and "verified.map(\\.revisionID) == items.map(\\.revisionID)" in cloud,
              "Sensor uploads require verified queue persistence": all("if pendingItem == nil && !enqueueHealthSync(item)" in section for section in [step_sync, energy_sync, motion_sync]),
              "Sensor sync reports success only after queue acknowledgement is verified": "guard acknowledgeHealthSync(item) else" in step_sync and "guard acknowledgeHealthSync(item) else" in energy_sync and "guard acknowledgeHealthSync(item) else" in motion_sync,
              "Sensor retry records are scoped to authenticated member ID": "currentUserID" in cloud and "ownerID" in outbox and "filter { $0.ownerID == ownerID }" in cloud,
              "HealthKit step write is queued before network request and acknowledged after success": "enqueueHealthSync(item)" in step_sync and step_sync.index("enqueueHealthSync(item)") < step_sync.index("performStepSync") and step_sync.index("performStepSync") < step_sync.index("acknowledgeHealthSync(item)"),
              "Active-energy write is queued before network request and acknowledged after success": "enqueueHealthSync(item)" in energy_sync and energy_sync.index("enqueueHealthSync(item)") < energy_sync.index("URLSession.shared.data") and energy_sync.index("URLSession.shared.data") < energy_sync.index("acknowledgeHealthSync(item)"),
              "Core Motion write is queued and acknowledged only after server success": "enqueueHealthSync(item)" in motion_sync and motion_sync.index("enqueueHealthSync(item)") < motion_sync.index("URLSession.shared.data") and motion_sync.index("URLSession.shared.data") < motion_sync.index("acknowledgeHealthSync(item)"),
              "Queued sensor writes retry after sign-in and on foreground": "await retryPendingHealthSyncs()" in cloud and "await cloud.retryPendingHealthSyncs()" in view,
              "Concurrent sensor outbox retry drains are serialized": "guard !isRetryingHealthOutbox else { return }" in cloud and "defer { isRetryingHealthOutbox = false }" in cloud,
              "Sensor outbox retry reuses the original idempotency revision": "pendingItem: item" in cloud and "if pendingItem == nil && !enqueueHealthSync(item)" in cloud,
              "Unreadable sensor outbox is not treated as an empty queue": "private func loadHealthOutbox() -> [PendingHealthSync]?" in cloud and "original data was left untouched" in cloud,
              "Unreadable sensor outbox exposes unknown count instead of false zero": "isHealthOutboxReadable = false" in cloud and "Pending count is unknown" in cloud and "if let items = loadHealthOutbox()" in cloud,
              "Enqueue and acknowledgement never overwrite unreadable sensor outbox": "guard var items = loadHealthOutbox() else { return false }" in cloud and "guard let items = loadHealthOutbox() else { return false }" in cloud,
              "Invalid sensor outbox dates are retained for recovery": "invalid date. The original record was retained for recovery" in cloud and "acknowledgeHealthSync(item)" not in cloud.split("guard let day = dateForLocalDay(item.localDay) else", 1)[1].split("}", 1)[0],
              "Sensor outbox retry preserves original revision through token refresh": "retryAfterRefresh: false, pendingItem: item" in cloud,
              "Member can see pending sensor-sync count": "pendingHealthSyncCount" in cloud and "pendingHealthSyncCount" in view,
              "Pending sync count never exposes another account's queue": "items.filter { $0.ownerID == currentUserID }.count" in cloud,
              "Older sensor upload cannot acknowledge a newer queued value": "($0.id == item.id && $0.revisionID == item.revisionID)" in cloud,
              "GPS cloud distance skips discontinuous segments": "if cloudPoints[index].breakBefore { continue }" in cloud,
              "Completed walks have a dedicated durable cloud outbox": "activity-sync-outbox.v1" in cloud and "struct PendingActivitySession: Codable" in cloud,
              "Activity outbox write is read back and verified": "UserDefaults.standard.set(data, forKey: activityOutboxKey)" in cloud and "JSONDecoder().decode([PendingActivitySession].self, from: saved)" in cloud,
              "Activity outbox is isolated to the signed-in member": "for item in pending where item.ownerID == ownerID" in activity_retry and "items.filter { $0.ownerID == currentUserID }.count" in cloud,
              "Activity retries retain stable session and revision identifiers": "record.id.uuidString" in cloud and "item.revisionID" in activity_retry,
              "Activity queue item is removed only after all available writes succeed": "guard allAcknowledged else { continue }" in activity_retry and activity_retry.index("syncActivitySessionRoute") < activity_retry.index("guard allAcknowledged else") < activity_retry.index("saveActivityOutbox(current.filter"),
              "Activity step and route RPCs return explicit acknowledgements": "async -> Bool" in cloud and "return true" in cloud.split("func syncActivitySession(", 1)[1].split("func syncActivitySessionRoute(", 1)[0] and "return true" in cloud.split("func syncActivitySessionRoute(", 1)[1].split("private func refreshSession()", 1)[0],
              "Existing local walks are backfilled into the activity outbox": "cloud.enqueueActivitySession(record)" in view,
              "Metadata-only activity records are not queued for cloud sync": "var hasCloudSyncPayload" in activity_model and "for record in accountRecords where record.hasCloudSyncPayload" in view,
              "Local activity backfill and cloud queue are scoped to the recording account": "let accountRecords = history.filter { $0.ownerID == ownerID }" in view and "guard record.ownerID == ownerID else" in cloud,
              "Activity history display is filtered by the authenticated account": "private var visibleActivityHistory" in view and "activityHistory.filter { $0.ownerID == ownerID }" in view and "ForEach(visibleActivityHistory.prefix(20))" in view,
              "Recovered GPS drafts retain a stable session ID and account owner": "activitySessionID = draft.sessionID ?? UUID()" in gps and "sessionID: sessionID" in gps and "ownerID: activityOwnerID" in gps and "ownerID: self.routeRecorder.activityOwnerID" in finish_activity,
              "Activity outbox retries on sign-in and foreground": "await cloud.retryPendingActivitySessions()" in view,
              "Unreadable activity outbox is preserved and not treated as empty": "Original data was preserved; pending count is unknown" in cloud and "return nil" in cloud.split("private func loadActivityOutbox()", 1)[1].split("private func saveActivityOutbox", 1)[0],
              "RunJeet daily totals are archived separately from Apple Health": "runJeetDailyStepsArchiveStore.merge" in view and "not merged into Apple Health" in view,
              "RunJeet daily archive writes are atomic and read-back verified": "data.write(to: url, options: .atomic)" in archive_store and "let verified = try load()" in archive_store and "guard verified == merged" in archive_store,
              "RunJeet archive imports are idempotent and preserve existing dates": "for (day, steps) in incoming where merged[day] == nil" in archive_store and "testMergeIsIdempotentAndExistingDatesWin" in archive_tests,
              "Corrupt RunJeet archives are preserved for recovery": "original file was preserved" in archive_store and "testCorruptArchiveIsPreservedAndNeverTreatedAsEmpty" in archive_tests,
              "Database allows unknown route steps without writing zero": "alter column steps drop not null" in migration and "steps = coalesce(excluded.steps, public.walk_sessions.steps)" in migration,
          }
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if not all(checks.values()):
              raise SystemExit("Real-time tracking safeguard verification failed")
          PY

      - name: Build GATIVX for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/GATIVX-Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify simulator privacy strings and source entitlement declarations
        run: |
          APP="build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app"
          test -f "$APP/Info.plist"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path("build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app")
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          for key in (
              "NSHealthShareUsageDescription",
              "NSMotionUsageDescription",
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ):
              if not info.get(key):
                  raise SystemExit(f"Missing permission purpose string: {key}")
          if "location" not in info.get("UIBackgroundModes", []):
              raise SystemExit("Background location mode is missing")

          entitlements_path = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "ios/GATIVX/GATIVX.entitlements"
          with entitlements_path.open("rb") as stream:
              entitlements = plistlib.load(stream)
          print("GATIVX source entitlements:", entitlements)
          if entitlements.get("com.apple.developer.healthkit") != True:
              raise SystemExit("HealthKit entitlement is missing")
          if entitlements.get("com.apple.developer.healthkit.background-delivery") != True:
              raise SystemExit("HealthKit background-delivery entitlement is missing")
          print("Simulator privacy strings and source entitlement declarations validated; signed device entitlements are not asserted.")
          PY

      - name: Upload simulator build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-iOS-Simulator
          path: build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app
          if-no-files-found: error
      # This creates an optimized Release device build, but it remains unsigned.
      # It is NOT installable until signed with a valid Apple provisioning profile.
      - name: Build unsigned iPhone Release app
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/GATIVX-Device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iPhone Release IPA
        run: |
          APP="build/GATIVX-Device/Build/Products/Release-iphoneos/GATIVX.app"
          test -d "$APP"
          mkdir -p build/GATIVX-IPA/Payload
          cp -R "$APP" build/GATIVX-IPA/Payload/GATIVX.app
          cd build/GATIVX-IPA
          /usr/bin/zip -qry ../GATIVX-unsigned.ipa Payload
          /usr/bin/unzip -t ../GATIVX-unsigned.ipa
          test -s ../GATIVX-unsigned.ipa

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-iPhone-unsigned-IPA
          path: build/GATIVX-unsigned.ipa
          if-no-files-found: error
