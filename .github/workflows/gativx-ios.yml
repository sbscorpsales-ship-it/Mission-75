name: GATIVX iOS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/GATIVX/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"
  push:
    branches:
      - main
      - "fix/gativx/**"
    paths:
      - "ios/GATIVX/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate GATIVX project
        run: xcodegen generate --spec ios/gativx-project.yml --project ios

      - name: Validate project and scheme
        run: xcodebuild -list -project ios/GATIVX.xcodeproj

      - name: Verify real-time tracking safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gps = Path("ios/GATIVX/GPSRouteRecorder.swift").read_text()
          view = Path("ios/GATIVX/ContentView.swift").read_text()
          health = Path("ios/GATIVX/HealthKit/HealthKitManager.swift").read_text()
          cloud = Path("ios/GATIVX/Cloud/SupabaseRESTClient.swift").read_text()
          migration = Path("supabase/migrations/20261109113101_allow_gps_route_sync_without_step_count.sql").read_text()

          checks = {
              "GPS accuracy filter": "location.horizontalAccuracy <= 50" in gps,
              "GPS long-gap segmentation": "elapsed > 30" in gps,
              "GPS jump/speed rejection": "delta > 150 || speed > 8" in gps,
              "Backward-compatible route draft decoding": "decodeIfPresent(Bool.self, forKey: .breakBefore) ?? false" in gps,
              "Route distance skips segment breaks": "!pair.1.breakBefore" in gps,
              "Cloud distance skips segment breaks": "if cloudPoints[index].breakBefore { continue }" in cloud,
              "Active walk keeps motion monitor in background": "sessionStarted == nil && !routeRecorder.isRecording" in view,
              "Prompt HealthKit background update requested": "frequency: .immediate" in health,
              "HealthKit step background cadence disclosed as hourly": "at most hourly" in health,
              "Active-energy query requires explicit HealthKit connection": "guard UserDefaults.standard.bool(forKey: connectionRequestedKey), isAvailable else" in health,
              "GPS route upload allows unknown steps without inventing zero": '"p_steps": steps.map { $0 as Any } ?? NSNull()' in cloud,
              "GPS cloud distance skips discontinuous segments": "if cloudPoints[index].breakBefore { continue }" in cloud,
              "Database allows unknown route steps without writing zero": "alter column steps drop not null" in migration and "steps = coalesce(excluded.steps, public.walk_sessions.steps)" in migration,
          }
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if not all(checks.values()):
              raise SystemExit("Real-time tracking safeguard verification failed")
          PY

      - name: Build GATIVX for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/GATIVX-Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged permissions and HealthKit entitlements
        run: |
          APP="build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app"
          test -f "$APP/Info.plist"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path("build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app")
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          for key in (
              "NSHealthShareUsageDescription",
              "NSMotionUsageDescription",
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ):
              if not info.get(key):
                  raise SystemExit(f"Missing permission purpose string: {key}")
          if "location" not in info.get("UIBackgroundModes", []):
              raise SystemExit("Background location mode is missing")

          entitlements_path = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "ios/GATIVX/GATIVX.entitlements"
          with entitlements_path.open("rb") as stream:
              entitlements = plistlib.load(stream)
          print("GATIVX source entitlements:", entitlements)
          if entitlements.get("com.apple.developer.healthkit") != True:
              raise SystemExit("HealthKit entitlement is missing")
          if entitlements.get("com.apple.developer.healthkit.background-delivery") != True:
              raise SystemExit("HealthKit background-delivery entitlement is missing")
          print("GATIVX permission strings and source entitlements validated")
          PY

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: GATIVX-iOS-Simulator
          path: build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app
          if-no-files-found: error
      # This creates a device-targeted unsigned IPA. It is NOT installable until
      # a trusted sideloading tool signs it with the user's own Apple ID.
      - name: Build unsigned iPhone device app
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/GATIVX-Device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iPhone IPA
        run: |
          APP="build/GATIVX-Device/Build/Products/Debug-iphoneos/GATIVX.app"
          test -d "$APP"
          mkdir -p build/GATIVX-IPA/Payload
          cp -R "$APP" build/GATIVX-IPA/Payload/GATIVX.app
          cd build/GATIVX-IPA
          /usr/bin/zip -qry ../GATIVX-unsigned.ipa Payload
          /usr/bin/unzip -t ../GATIVX-unsigned.ipa
          test -s ../GATIVX-unsigned.ipa

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: GATIVX-iPhone-unsigned-IPA
          path: build/GATIVX-unsigned.ipa
          if-no-files-found: error
