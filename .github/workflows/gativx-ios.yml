              "Unreadable activity outbox is preserved and not treated as empty": "Original data was preserved; pending count is unknown" in cloud and "return nil" in cloud.split("private func loadActivityOutbox()", 1)[1].split("private func saveActivityOutbox", 1)[0],
              "RunJeet daily totals are archived separately from Apple Health": "runJeetDailyStepsArchiveStore.merge" in view and "not merged into Apple Health" in view,
              "RunJeet daily archive writes are atomic and read-back verified": "data.write(to: url, options: .atomic)" in archive_store and "let verified = try load()" in archive_store and "guard verified == merged" in archive_store,
              "RunJeet archive imports are idempotent and preserve existing dates": "for (day, steps) in incoming where merged[day] == nil" in archive_store and "testMergeIsIdempotentAndExistingDatesWin" in archive_tests,
              "Corrupt RunJeet archives are preserved for recovery": "original file was preserved" in archive_store and "testCorruptArchiveIsPreservedAndNeverTreatedAsEmpty" in archive_tests,
              "Database allows unknown route steps without writing zero": "alter column steps drop not null" in migration and "steps = coalesce(excluded.steps, public.walk_sessions.steps)" in migration,
          }
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if not all(checks.values()):
              raise SystemExit("Real-time tracking safeguard verification failed")
          PY

      - name: Build GATIVX for iPhone Simulator
        id: simulator_build
        if: always()
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/GATIVX-Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify simulator privacy strings and source entitlement declarations
        id: simulator_privacy
        if: always()
        run: |
          APP="build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app"
          test -f "$APP/Info.plist"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          app = Path("build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app")
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          executable = info.get("CFBundleExecutable")
          if not isinstance(executable, str) or not executable.strip():
              raise SystemExit("Simulator app CFBundleExecutable is missing")
          executable_path = app / executable
          if not executable_path.is_file() or executable_path.stat().st_size == 0 or not os.access(executable_path, os.X_OK):
              raise SystemExit("Simulator app executable is missing, empty or not executable")
          if info.get("CFBundleIdentifier") != "com.paramitsolutions.gativx":
              raise SystemExit("GATIVX bundle identifier is missing or incorrect")
          if info.get("CFBundleVersion") != "1":
              raise SystemExit("GATIVX CFBundleVersion must be 1 for this release")
          if info.get("CFBundleShortVersionString") != "1.0.0":
              raise SystemExit("GATIVX marketing version must be 1.0.0 for this release")
          for key in (
              "NSHealthShareUsageDescription",
              "NSMotionUsageDescription",
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ):
              if not info.get(key):
                  raise SystemExit(f"Missing permission purpose string: {key}")
          if "location" not in info.get("UIBackgroundModes", []):
              raise SystemExit("Background location mode is missing")

          entitlements_path = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "ios/GATIVX/GATIVX.entitlements"
          with entitlements_path.open("rb") as stream:
              entitlements = plistlib.load(stream)
          print("GATIVX source entitlements:", entitlements)
          if entitlements.get("com.apple.developer.healthkit") != True:
              raise SystemExit("HealthKit entitlement is missing")
          if entitlements.get("com.apple.developer.healthkit.background-delivery") != True:
              raise SystemExit("HealthKit background-delivery entitlement is missing")
          print("Simulator privacy strings and source entitlement declarations validated; signed device entitlements are not asserted.")
          PY

      - name: Upload simulator build
        id: simulator_upload
        if: always() && steps.simulator_build.outcome == 'success' && steps.simulator_privacy.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-iOS-Simulator
          path: build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app
          if-no-files-found: error
      # This creates an optimized Release device build, but it remains unsigned.
      # It is NOT installable until signed with a valid Apple provisioning profile.
      - name: Build unsigned iPhone Release app
        id: release_build
        if: always()
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build/GATIVX-Device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iPhone Release IPA
        id: ipa_package
        if: always() && steps.release_build.outcome == 'success'
        run: |
          APP="build/GATIVX-Device/Build/Products/Release-iphoneos/GATIVX.app"
          test -d "$APP"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -n "$EXECUTABLE_NAME"
          test -s "$APP/$EXECUTABLE_NAME"
          test -x "$APP/$EXECUTABLE_NAME"
          mkdir -p build/GATIVX-IPA/Payload
          cp -R "$APP" build/GATIVX-IPA/Payload/GATIVX.app
          cd build/GATIVX-IPA
          /usr/bin/zip -qry ../GATIVX-unsigned.ipa Payload
          /usr/bin/unzip -t ../GATIVX-unsigned.ipa
          python3 - <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile("../GATIVX-unsigned.ipa") as archive:
              app_prefix = "Payload/GATIVX.app/"
              info = plistlib.loads(archive.read(app_prefix + "Info.plist"))
              executable = info.get("CFBundleExecutable")
              if not isinstance(executable, str) or not executable.strip():
                  raise SystemExit("Release IPA CFBundleExecutable is missing")
              executable_path = app_prefix + executable
              if executable_path not in archive.namelist():
                  raise SystemExit(f"Release IPA is missing its executable: {executable_path}")
              executable_info = archive.getinfo(executable_path)
              if executable_info.file_size == 0:
                  raise SystemExit("Release IPA executable is empty")
              with archive.open(executable_path) as stream:
                  magic = stream.read(4)
              valid_mach_o_magic = {
                  b"\xcf\xfa\xed\xfe", b"\xfe\xed\xfa\xcf",
                  b"\xca\xfe\xba\xbe", b"\xbe\xba\xfe\xca",
                  b"\xca\xfe\xba\xbf", b"\xbf\xba\xfe\xca",
              }
              if magic not in valid_mach_o_magic:
                  raise SystemExit(f"Release IPA executable has invalid Mach-O magic: {magic!r}")
          expected = {
              "CFBundleIdentifier": "com.paramitsolutions.gativx",
              "CFBundleVersion": "1",
              "CFBundleShortVersionString": "1.0.0",
          }
          for key, value in expected.items():
              if info.get(key) != value:
                  raise SystemExit(f"Release IPA has incorrect {key}: {info.get(key)!r}")
          print("Release IPA bundle identity and version metadata verified.")
          PY
          test -s ../GATIVX-unsigned.ipa

      - name: Upload unsigned iPhone IPA
        id: ipa_upload
        if: always() && steps.ipa_package.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-iPhone-unsigned-IPA
          path: build/GATIVX-unsigned.ipa
          if-no-files-found: error

      # Keep XCTest as a release gate, but evaluate it only after every independent
      # entitlement, tracking, simulator and unsigned-IPA gate has been attempted.
      - name: Enforce complete GATIVX release validation
        if: always()
        run: |
          python3 - <<'PY'
          import os
          outcomes = {
              "XCTest": "${{ steps.xctest.outcome }}",
              "HealthKit source entitlements": "${{ steps.healthkit.outcome }}",
              "Tracking safeguards": "${{ steps.tracking.outcome }}",
              "iPhone Simulator build": "${{ steps.simulator_build.outcome }}",
              "Simulator privacy and entitlement validation": "${{ steps.simulator_privacy.outcome }}",
              "Simulator artifact upload": "${{ steps.simulator_upload.outcome }}",
              "Unsigned iPhone Release build": "${{ steps.release_build.outcome }}",
              "Unsigned IPA packaging": "${{ steps.ipa_package.outcome }}",
              "Unsigned IPA artifact upload": "${{ steps.ipa_upload.outcome }}",
          }
          for name, outcome in outcomes.items():
              print(f"{'PASS' if outcome == 'success' else 'FAIL'}: {name} — {outcome}")
          failed = [name for name, outcome in outcomes.items() if outcome != "success"]
          if failed:
              raise SystemExit("Release validation incomplete or failed: " + ", ".join(failed))
          print("All automated release gates passed. Physical-device signing, installation and HealthKit behavior remain separate manual gates.")
          PY
