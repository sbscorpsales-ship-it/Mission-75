          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          spec = Path("ios/gativx-project.yml").read_text()
          if "CODE_SIGN_ENTITLEMENTS: GATIVX/GATIVX.entitlements" not in spec:
              raise SystemExit("Generated GATIVX target is not configured with HealthKit entitlements")
          with Path("ios/GATIVX/GATIVX.entitlements").open("rb") as stream:
              entitlements = plistlib.load(stream)
          if entitlements.get("com.apple.developer.healthkit") is not True:
              raise SystemExit("HealthKit entitlement missing")
          if entitlements.get("com.apple.developer.healthkit.background-delivery") is not True:
              raise SystemExit("HealthKit background-delivery entitlement missing")
          print("HealthKit source entitlement configuration verified; device signing remains a separate gate.")
          PY

