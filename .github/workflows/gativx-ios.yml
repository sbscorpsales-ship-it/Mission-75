name: GATIVX iOS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/GATIVX/**"
      - "ios/GATIVXTests/**"
      - "ios/GATIVXUITests/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/GATIVX/**"
      - "ios/GATIVXTests/**"
      - "ios/GATIVXUITests/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"

permissions:
  contents: read

# Run one validation per source branch across push and pull-request events.
# A newer commit supersedes the older run; the extended job timeout protects the full pipeline.
concurrency:
  group: gativx-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26-intel
    # UI tests, result-bundle upload and both builds need headroom on hosted macOS.
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate GATIVX project
        run: xcodegen generate --spec ios/gativx-project.yml --project ios

      - name: Validate project and scheme
        run: xcodebuild -list -project ios/GATIVX.xcodeproj

      - name: Verify GATIVX first-run auth, portrait layout and permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re

          cloud = Path("ios/GATIVX/Cloud/SupabaseRESTClient.swift").read_text()
          view = Path("ios/GATIVX/ContentView.swift").read_text()
          guru_model = Path("ios/GATIVX/Models/GATIVXGoalJourney.swift").read_text()
          guru_tests = Path("ios/GATIVXTests/GATIVXGoalJourneyTests.swift").read_text()
          gps_tests = Path("ios/GATIVXTests/GPSRouteDraftPersistenceTests.swift").read_text()
          ui_tests = Path("ios/GATIVXUITests/GATIVXDashboardUITests.swift").read_text()
          spec = Path("ios/gativx-project.yml").read_text()
          workflow = Path(".github/workflows/gativx-ios.yml").read_text()
          with Path("ios/GATIVX/Info.plist").open("rb") as stream:
              info = plistlib.load(stream)

          key_match = re.search(r'private let publishableKey = "([^"]+)"', cloud)
          assert key_match, "Supabase publishable key is missing"
          assert key_match.group(1).startswith("sb_publishable_"), "Mobile app must use a publishable key"
          assert "sb_secret_" not in cloud and "service_role" not in cloud, "A privileged Supabase key must never ship in the app"
          assert "https://crarbbsvcczwmtvxyrxo.supabase.co" in cloud, "Supabase project URL changed unexpectedly"
          assert "auth/v1/signup" in cloud and "auth/v1/token" in cloud, "Sign-up and password sign-in endpoints must both exist"
          assert "await cloud.signUp(email: cleanEmail, password: password)" in view, "Optional account registration action is not connected"
          assert "await cloud.signIn(email: cleanEmail, password: password)" in view, "Optional account sign-in action is not connected"
          assert 'Section("Account")' in view and 'Button("Sign out", role: .destructive)' in view, "Account management must remain available in Profile"
          assert "An account is optional." in view, "Dashboard must remain usable without an account"
          root_start = view.index("    var body: some View {", view.index("private var welcomeScreen"))
          root_end = view.index(".sheet(isPresented:", root_start)
          launch_root = view[root_start:root_end]
          assert "if cloud.isSignedIn || localModeEntered" in launch_root, "Member dashboard must require an authenticated account or explicit local-only entry"
          assert "selectedMemberScreen" in launch_root and "homeDashboard" in view and "memberBottomNavigation" in view, "The approved single-navigation dashboard shell must be available after member entry"
          assert "TabView(selection: $selectedTab)" not in view, "A native TabView must not duplicate the persistent member dock"
          assert "        } else {\n            welcomeScreen\n        }\n    }\n}" in view, "First launch must present registration/sign-in before the dashboard"
          assert "gativx-continue-guest" in view and "gativx-auth-submit" in view and "gativx-auth-mode-toggle" in view, "Registration, sign-in and explicit local-only entry controls must be available"
          assert "authenticatedUserEmail" in cloud and "gativx-dashboard-member-identity" in view and "gativx-member-login-id" in view, "Authenticated login ID must be visible in the dashboard and Profile"
          assert 'accessibilityIdentifier("gativx-home-dashboard")' in view, "Dashboard needs a stable test identifier"
          assert "GATIVX GURU" in view and "GATIVX Guru" in view and "NURUN" in view, "GATIVX Guru / NURUN branding must remain available in dashboard and navigation"
          assert '.fullScreenCover(isPresented: $isGuruPresented)' in view, "Guru must open as a full-screen experience, never a partial sheet"
          assert 'accessibilityIdentifier("gativx-guru-fullscreen")' in view, "Guru needs a stable full-screen viewport identifier"
          assert "gativx-guru-walking" in view and "gativx-guru-nutrition" in view and "gativx-guru-recovery" in view, "Guru must guide movement, food habits and recovery"
          assert "gativx-guru-learning" in view, "Guru must provide curated learning resources"
          dashboard = view.split("private var homeDashboard: some View", 1)[1].split("private func wellnessSnapshotCard", 1)[0]
          assert 'Text("GATI GURU")' in dashboard, "Approved home dashboard must show the Gati Guru section"
          assert 'Image(systemName: "bell.badge")' in dashboard, "Approved dashboard header must include the notification bell"
          assert 'Image(systemName: "person.crop.circle.fill")' in dashboard, "Approved dashboard header must include the member profile image"
          approved_sections = ["TODAY'S STEPS", "private var todayMissionCard", "private var todayActivityCard", "private var activityTrackerCard", "private var guruEntryCard", "private var myJourneyCard", "private var communityGatiCard"]
          section_positions = [dashboard.index(section) for section in approved_sections]
          assert section_positions == sorted(section_positions), "Dashboard sections must retain the approved order"
          activity_card = dashboard.split("private var todayActivityCard", 1)[1].split("private var activityTrackerCard", 1)[0]
          assert activity_card.count("wellnessSnapshotCard(") == 4 and all(f'"{metric}"' in activity_card for metric in ("Distance", "Active time", "Calories", "Avg. heart rate")), "Dashboard must show exactly four approved health metrics"
          assert dashboard.count(".tabItem { Label(") == 0, "Navigation tabs belong to the persistent app shell, not the scrollable dashboard"
          step_ring = view.split("private var stepRing: some View", 1)[1].split("private var homeDashboard", 1)[0]
          assert ".frame(width: 190, height: 190)" not in step_ring, "Step ring must respect its responsive dashboard container"
          assert "let ringDiameter = min(max(width * 0.34, 128), 148)" in view, "Dashboard must size the step ring responsively for iPhone width"
          assert "stepRing.frame(width: ringDiameter, height: ringDiameter)" in view, "Step ring must use the responsive dashboard size"
          assert "GeometryReader { geometry in" in view and "homeDashboardContent(width: geometry.size.width, height: geometry.size.height)" in view and ".frame(height: heroHeight)" in view, "Dashboard hero and spacing must adapt to available screen dimensions"
          assert "motionMonitoringEnabled" in view and "if motionMonitoringEnabled { startLiveMotionMonitor() }" in view, "Daily motion tracking must be opt-in, not prompted at launch"
          assert "GATIVXGuruCoach.suggestedNextAction" in view and "GATIVXGuruCoach.purposeAnchor" in view, "Guru must generate purpose-aware next actions, not only store form answers"
          assert "moves you toward feeling" in guru_model and "testGuruConnectsGoalPurposeAndEmotionToPracticalNextAction" in guru_tests, "Guru next actions must connect goal, purpose and desired emotion"
          assert "gativx.journey.durationDays" in view and "gativx.journey.startedAt" in view and "gativx.journey.goal" in view, "Goal journey state must persist locally"
          assert "gativx.journey.activeDurationDays" in view and "guruActiveJourneyDurationDays > 0 ? guruActiveJourneyDurationDays : guruJourneyDurationDays" in view and "guruActiveJourneyDurationDays = guruJourneyDurationDays" in view, "An active journey must keep its original duration when the next selection changes"
          assert all(f'Text("{days} days").tag({days})' in view for days in (30, 90, 180, 365)), "30/90/180/365-day journey choices are required"
          assert "testJourneyCalculatesElapsedDaysRemainingAndProgress" in guru_tests and "testGuruAdaptsNextActionToRemainingDailySteps" in guru_tests and "testAllSupportedJourneyDurationsCalculateProgressAndCompletion" in guru_tests, "Guru and all four journey durations must have unit coverage"
          assert "gativx-journey-duration" in view and "gativx-start-journey" in view, "Journey controls need stable UI test targets"
          assert "gativx-guru-goal" in view and "gativx-guru-goal" in ui_tests and "@FocusState private var focusedGuruField: GuruField?" in view and all(f".focused($focusedGuruField, equals: .{field})" in view for field in ("goal", "purpose", "emotion", "nextAction", "mealNote")), "Every Guru input must have a field-specific SwiftUI focus target"
          assert "Community feed and shared missions are not available yet" in view and "gativx-community-gated" in view, "Community must be clearly gated until real shared data exists"
          assert "GATIVX notifications are not active in this build yet" in view and "gativx-notifications-gated" in view, "Notifications must be clearly gated until delivery is implemented"
          assert "gativx-guru-entry" in view and "YOUR GOAL JOURNEY" in view and "ONE PRACTICAL NEXT ACTION" in view, "Dashboard must expose the implemented Guru journey"
          assert "gativx-journey-duration" in ui_tests and "gativx-community-gated" in ui_tests and "gativx-notifications-gated" in ui_tests, "UI tests must cover journey entry and inactive feature gates"
          assert "DAY 1 OF 180" in ui_tests and "DAY 1 OF 30" in ui_tests, "UI tests must prove a started journey keeps its duration after changing the next selection"

          required_usage = [
              "NSHealthShareUsageDescription",
              "NSHealthUpdateUsageDescription",
              "NSMotionUsageDescription",
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ]
          for key in required_usage:
              assert isinstance(info.get(key), str) and info[key].strip(), f"Missing privacy usage description: {key}"
          assert "location" in info.get("UIBackgroundModes", []), "Background location mode is missing"
          assert info.get("UISupportedInterfaceOrientations") == ["UIInterfaceOrientationPortrait"], "GATIVX must stay in portrait on iPhone"
          assert "UIInterfaceOrientationPortrait" in spec, "XcodeGen spec must retain portrait-only orientation"
          assert "NSContactsUsageDescription" not in info and "CNContactStore" not in view, "Do not request Contacts for core fitness features"
          assert "steps.simulator_build.outcome == 'success'" in workflow and "steps.simulator_privacy.outcome == 'success'" in workflow, "Simulator artifact upload must require a successful build and validation"
          assert "steps.release_build.outcome == 'success'" in workflow and "steps.ipa_package.outcome == 'success'" in workflow, "IPA packaging and upload must be gated by successful upstream steps"
          assert "CFBundleExecutable" in workflow and "test -x" in workflow, "Simulator and IPA artifacts must verify the real app executable"

          print("PASS: publishable Supabase configuration and both auth endpoints")
          print("PASS: member-first registration/sign-in with explicit local-only dashboard entry")
          print("PASS: opt-in Motion permission and portrait-only native layout")
          print("PASS: HealthKit, Motion and GPS usage descriptions")
          print("PASS: no unnecessary Contacts permission")
          print("PASS: simulator and IPA artifacts require a real executable and successful upstream builds")
          PY

      - name: Run full GATIVX unit and UI test suites (serial simulator, 40-minute cap)
        id: xctest
        timeout-minutes: 40
        run: |
          SIMULATOR_SELECTION="$(xcrun simctl list devices available -j | python3 -c 'import json, re, sys; data = json.load(sys.stdin); candidates = []; [(candidates.append((tuple(int(part) for part in match.groups() if part is not None) if match else (0,), runtime, device["name"], device["udid"]))) for runtime, devices in data["devices"].items() for match in [re.search(r"iOS-(\\d+)-(\\d+)(?:-(\\d+))?", runtime)] for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; preferred = [candidate for candidate in candidates if candidate[2] == "iPhone 17 Pro"]; pool = preferred or candidates; selected = max(pool, key=lambda candidate: (candidate[0], candidate[2])) if pool else None; print("\\t".join((selected[3], selected[2], selected[1])) if selected else "")')"
          IFS=
          echo "Available simulator devices:"
          xcrun simctl list devices available
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator was found on this runner."
            echo "Xcode destinations for the GATIVX scheme:"
            xcodebuild -showdestinations -project ios/GATIVX.xcodeproj -scheme GATIVX || true
            exit 1
          fi
                    xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/GATIVX-Tests \
            -resultBundlePath build/GATIVX.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload XCTest result bundle and dashboard screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-xcresult
          path: build/GATIVX.xcresult
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      # Export structured summaries and failure attachments for faster diagnosis.
      # This is best-effort only; the original XCTest outcome remains a hard release gate.
      - name: Export structured XCTest diagnostics
        if: always()
        run: |
          bash -n scripts/export-xctest-diagnostics.sh
          bash scripts/export-xctest-diagnostics.sh build/GATIVX.xcresult build/GATIVX-XCTest-Diagnostics

      - name: Upload structured XCTest diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-XCTest-Diagnostics
          path: build/GATIVX-XCTest-Diagnostics
          if-no-files-found: warn
          retention-days: 7

      - name: Verify generated target references HealthKit source entitlements
        id: healthkit
        if: always()
        run: |
          SETTINGS="$(xcodebuild -showBuildSettings -project ios/GATIVX.xcodeproj -scheme GATIVX)"
          echo "$SETTINGS" | grep -F 'CODE_SIGN_ENTITLEMENTS = GATIVX/GATIVX.entitlements'
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          spec = Path("ios/gativx-project.yml").read_text()
          if "CODE_SIGN_ENTITLEMENTS: GATIVX/GATIVX.entitlements" not in spec:
              raise SystemExit("Generated GATIVX target is not configured with HealthKit entitlements")
          with Path("ios/GATIVX/GATIVX.entitlements").open("rb") as stream:
              entitlements = plistlib.load(stream)
          if entitlements.get("com.apple.developer.healthkit") is not True:
              raise SystemExit("HealthKit entitlement missing")
          if entitlements.get("com.apple.developer.healthkit.background-delivery") is not True:
              raise SystemExit("HealthKit background-delivery entitlement missing")
          print("HealthKit source entitlement configuration verified; device signing remains a separate gate.")
          PY

      - name: Verify real-time tracking safeguards
        id: tracking
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gps = Path("ios/GATIVX/GPSRouteRecorder.swift").read_text()
          gps_tests = Path("ios/GATIVXTests/GPSRouteDraftPersistenceTests.swift").read_text()
          ui_tests = Path("ios/GATIVXUITests/GATIVXDashboardUITests.swift").read_text()
          activity_store = Path("ios/GATIVX/Storage/ActivitySessionStore.swift").read_text()
          activity_outbox_tests = Path("ios/GATIVXTests/GATIVXActivitySessionTests.swift").read_text()
          archive_store = Path("ios/GATIVX/Storage/RunJeetDailyStepsArchiveStore.swift").read_text()
          archive_tests = Path("ios/GATIVXTests/RunJeetBackupImporterTests.swift").read_text()
          activity_model = Path("ios/GATIVX/Models/ActivitySessionRecord.swift").read_text()
          view = Path("ios/GATIVX/ContentView.swift").read_text()
          health = Path("ios/GATIVX/HealthKit/HealthKitManager.swift").read_text()
          health_outbox = Path("ios/GATIVX/Storage/HealthKitWorkoutOutboxStore.swift").read_text()
          health_outbox_tests = Path("ios/GATIVXTests/HealthKitWorkoutOutboxStoreTests.swift").read_text()
          sensor_outbox = Path("ios/GATIVX/Storage/HealthSyncOutboxStore.swift").read_text()
          sensor_outbox_tests = Path("ios/GATIVXTests/HealthSyncOutboxStoreTests.swift").read_text()
          cloud = Path("ios/GATIVX/Cloud/SupabaseRESTClient.swift").read_text()
          migration = Path("supabase/migrations/20261109113101_allow_gps_route_sync_without_step_count.sql").read_text()
          outbox = cloud.split("enum PendingHealthSyncKind", 1)[1] if "enum PendingHealthSyncKind" in cloud else ""
          activity_outbox = cloud.split("struct PendingActivitySession", 1)[1] if "struct PendingActivitySession" in cloud else ""
          activity_retry = cloud.split("func retryPendingActivitySessions()", 1)[1].split("func signIn", 1)[0] if "func retryPendingActivitySessions()" in cloud else ""
          step_sync = cloud.split("func syncSteps(date: Date, steps: Int, pendingItem:", 1)[1].split("func syncActiveEnergy", 1)[0]
          energy_sync = cloud.split("func syncActiveEnergy", 1)[1].split("func syncMotionDailySteps", 1)[0]
          motion_sync = cloud.split("func syncMotionDailySteps", 1)[1].split("private func performStepSync", 1)[0]
          start_activity = view.split("private func startActivitySession()", 1)[1].split("private func finishActivitySession()", 1)[0]
          daily_display = view.split("private var displayedDailySteps", 1)[1].split("private var displayedStepSource", 1)[0]
          motion_monitor = view.split("private func startLiveMotionMonitor()", 1)[1].split("private func loadActivityHistory()", 1)[0]
          finish_activity = view.split("private func finishActivitySession()", 1)[1].split("/// Prefer HealthKit", 1)[0]
          auth_handler = gps.split("func locationManagerDidChangeAuthorization", 1)[1].split("func locationManager(", 1)[0]
          profile_tab_body = view.split("private var selectedMemberScreen", 1)[1].split("private func tabNavigationItem", 1)[0]
          profile_screen = view.split("private var profileScreen", 1)[1].split("private func progressMeterCard", 1)[0]
          profile_photo_sheet = view.split("private var profilePhotoPickerSheet", 1)[1].split("private var profileScreen", 1)[0]
          root_body = view.split("var body: some View", 1)[1].split("} else {\\n            welcomeScreen", 1)[0]
          save_workout_method = health.split("func saveActivityWorkout(", 1)[1].split("private func performActivityWorkoutExport(", 1)[0]
          workout_export = health.split("func saveActivityWorkout(", 1)[1].split("func disconnect()", 1)[0]
          duplicate_check = workout_export.find("if samples?.isEmpty == false")
          first_workout_ack = workout_export.find("self.acknowledgeWorkout(id)")
          finish_workout = workout_export.find("builder.finishWorkout")
          confirmed_save = workout_export.find("else if workout != nil")
          second_workout_ack = workout_export.find("self.acknowledgeWorkout(id)", first_workout_ack + 1)
          confirmed_save_completion = workout_export.find("completion(.success(()))", confirmed_save)

          invalid_date_guard = "guard let date = HealthSyncOutboxStore.dateForLocalDay(item.localDay) else"
          invalid_date_recovery = cloud.split(invalid_date_guard, 1)[1].split("}", 1)[0] if invalid_date_guard in cloud else ""

          checks = {
              "Native daily total falls back to the live iPhone pedometer": "health.todaySteps ?? liveMotionSteps" in daily_display,
              "Starting a walk never fabricates a zero-step reading": "sessionSteps = 0" not in start_activity and "self.sessionSteps = data?.numberOfSteps.intValue" in start_activity,
              "Core Motion authorization state is surfaced": "CMPedometer.authorizationStatus()" in motion_monitor and "Motion & Fitness access is denied" in motion_monitor,
              "Core Motion sensor errors are not silently discarded": "iPhone pedometer error:" in motion_monitor,
              "Core Motion live daily steps remain a separate sensor source": "self.liveMotionSteps = steps" in motion_monitor and "syncMotionDailySteps" in motion_monitor,
              "GPS activity starts even without pedometer": "routeRecorder.start(activity: selectedActivity, ownerID: cloud.authenticatedUserID)" in start_activity and start_activity.index("routeRecorder.start(activity: selectedActivity, ownerID: cloud.authenticatedUserID)") < start_activity.index("guard CMPedometer.isStepCountingAvailable()"),
              "GPS-only activity button remains enabled without pedometer": 'Button { startActivitySession() } label:' in view and ".disabled(!CMPedometer.isStepCountingAvailable())" not in view,
              "GPS route is saved when pedometer is unavailable": "saveRecord(nil, nil)" in finish_activity or "saveRecord(nil,nil)" in finish_activity and "routePoints: routePoints" in finish_activity,
              "Workout finish rejects duplicate in-flight taps": "guard !isFinishingSession, let start = sessionStarted else { return }" in finish_activity,
              "Workout finish reconciles by stable session ID before clearing the recovered GPS draft": "let recordID = routeRecorder.activitySessionID ?? activeSessionID ?? UUID()" in finish_activity and "id: recordID" in finish_activity and "history = self.activityStore.upserting(record, into: history)" in finish_activity and "persistedHistory.contains(where: { $0.id == recordID })" in finish_activity and "func upserting(_ record: ActivitySessionRecord" in activity_store and "updated[index] = updated[index].mergingRecovery(record)" in activity_store,
              "Workout finish button is disabled while saving": ".disabled(isFinishingSession)" in view and "Saving activity…" in view,
              "Failed local save leaves the session retryable": "tap Finish & save activity to retry" in finish_activity and "self.sessionStarted = start" in finish_activity,
              "Sensor-empty activity is retained for retry rather than discarded": "Your session remains available" in finish_activity and "self.sessionStarted = nil" not in finish_activity.split("guard finalSteps != nil || !routePoints.isEmpty else", 1)[1].split("}", 1)[0] and "self.routeRecorder.clearDraft()" not in finish_activity.split("guard finalSteps != nil || !routePoints.isEmpty else", 1)[1].split("}", 1)[0],
              "Sensor-empty Finish & Save resumes the durable GPS draft for retry": "self.routeRecorder.resumeRecovered()" in finish_activity and "Your session remains available" in finish_activity,
              "Cloud activity sync reports corrupt local history instead of treating it as empty": "Cloud sync paused: saved activity history could not be read" in view and "try activityStore.load()" in view,
              "Completed activity is atomically stored and read back before GPS draft clearing": "try self.activityStore.save(history)" in finish_activity and "let persistedHistory = try self.activityStore.load()" in finish_activity and finish_activity.index("try self.activityStore.save(history)") < finish_activity.index("let persistedHistory = try self.activityStore.load()") < finish_activity.index("self.routeRecorder.clearDraft()"),
              "Local activity is decoded and verified before GPS draft clearing": "let persistedHistory = try self.activityStore.load()" in finish_activity and "persistedHistory.contains(where: { $0.id == recordID })" in finish_activity and finish_activity.index("persistedHistory.contains") < finish_activity.index("self.routeRecorder.clearDraft()"),
              "Activity history uses atomic Application Support file writes": "applicationSupportDirectory" in activity_store and "data.write(to: url, options: .atomic)" in activity_store,
              "Activity history file is read back and decoded before success": "let savedData = try Data(contentsOf: url)" in activity_store and "JSONDecoder().decode([ActivitySessionRecord].self, from: savedData)" in activity_store and "savedRecords.map(\\.id) == records.map(\\.id)" in activity_store,
              "Legacy history is removed only after verified file migration": "try write(records, to: url)" in activity_store and activity_store.index("try write(records, to: url)") < activity_store.index("userDefaults.removeObject(forKey: legacyKey)"),
              "Corrupt activity history is never overwritten with an empty list": "Could not read existing activity history" in finish_activity and "try self.activityStore.load()" in finish_activity,
              "Failed local activity save preserves GPS draft": "Your GPS draft remains preserved" in finish_activity and "catch {" in finish_activity,
              "Always permission enables background GPS during an active walk": "else if isRecording" in auth_handler and "manager.allowsBackgroundLocationUpdates = true" in auth_handler and "manager.showsBackgroundLocationIndicator = true" in auth_handler,
              "Active GPS updates resume after permission change": "manager.startUpdatingLocation()" in auth_handler,
              "Location downgrade removes background GPS claim": "manager.allowsBackgroundLocationUpdates = false" in auth_handler and "Allow Always location for background recording" in auth_handler,
              "GPS accuracy filter": "location.horizontalAccuracy <= 50" in gps,
              "GPS long-gap segmentation": "elapsed > 30" in gps,
              "GPS jump/speed rejection": "delta > 150 || speed > 8" in gps,
              "Backward-compatible route draft decoding": "decodeIfPresent(Bool.self, forKey: .breakBefore) ?? false" in gps,
              "iPhone GPS draft uses atomic Application Support file writes": "applicationSupportDirectory" in gps and "data.write(to: url, options: .atomic)" in gps,
              "GPS draft writes are read-back verified": "GPSRouteDraftPersistence.write(draft, to: url)" in gps and "savedData == data" in gps and "testWriteAtomicallyReadsBackSessionOwnerAndRoute" in gps_tests and "testWriteFailureDoesNotReplaceExistingData" in gps_tests,
              "GPS route persistence failure is not overwritten by recording success": "if persistDraft() {" in gps and gps.index("if persistDraft() {") < gps.index("Recording GPS route ·") and "GPS is recording, but the route draft is not safely stored" in gps,
              "Legacy UserDefaults GPS drafts migrate only after file write succeeds": "if fileData == nil, let legacyData, let url" in gps and "userDefaults.removeObject(forKey: draftKey)" in gps,
              "Unreadable iPhone GPS draft is preserved rather than silently discarded": "original data was preserved for recovery" in gps,
              "Unreadable GPS draft blocks new walks and remains preserved": "hasUnreadableDraft = true" in gps and "guard !isRecording, activeStartedAt == nil, !hasUnreadableDraft" in gps and "routeRecorder.hasUnreadableDraft" in start_activity and "RECOVERY NEEDED" in view and "routeRecorder.hasUnreadableDraft ? routeRecorder.status" in view,
