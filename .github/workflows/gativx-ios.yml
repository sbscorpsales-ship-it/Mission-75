name: GATIVX iOS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/GATIVX/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"
  push:
    branches:
      - main
      - "fix/gativx/**"
    paths:
      - "ios/GATIVX/**"
      - "ios/gativx-project.yml"
      - ".github/workflows/gativx-ios.yml"

permissions:
  contents: read

concurrency:
  group: gativx-ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate GATIVX project
        run: xcodegen generate --spec ios/gativx-project.yml --project ios

      - name: Validate project and scheme
        run: xcodebuild -list -project ios/GATIVX.xcodeproj

      - name: Verify generated HealthKit target signing configuration
        run: |
          SETTINGS="$(xcodebuild -showBuildSettings -project ios/GATIVX.xcodeproj -scheme GATIVX)"
          echo "$SETTINGS" | grep -F 'CODE_SIGN_ENTITLEMENTS = GATIVX/GATIVX.entitlements'
          python3 - <<'PY'
          from pathlib import Path
          import plistlib

          spec = Path("ios/gativx-project.yml").read_text()
          if "CODE_SIGN_ENTITLEMENTS: GATIVX/GATIVX.entitlements" not in spec:
              raise SystemExit("Generated GATIVX target is not configured to sign with its HealthKit entitlements file")
          with Path("ios/GATIVX/GATIVX.entitlements").open("rb") as stream:
              entitlements = plistlib.load(stream)
          if entitlements.get("com.apple.developer.healthkit") is not True:
              raise SystemExit("HealthKit capability is absent from GATIVX source entitlements")
          print("Generated target points to the HealthKit entitlement file.")
          print("Note: this CI job is unsigned; only a device-signed build with a HealthKit-enabled provisioning profile can prove the installed entitlement.")
          PY

      - name: Verify real-time tracking safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gps = Path("ios/GATIVX/GPSRouteRecorder.swift").read_text()
          view = Path("ios/GATIVX/ContentView.swift").read_text()
          health = Path("ios/GATIVX/HealthKit/HealthKitManager.swift").read_text()
          cloud = Path("ios/GATIVX/Cloud/SupabaseRESTClient.swift").read_text()
          migration = Path("supabase/migrations/20261109113101_allow_gps_route_sync_without_step_count.sql").read_text()
          outbox = cloud.split("private enum PendingHealthSyncKind", 1)[1] if "private enum PendingHealthSyncKind" in cloud else ""
          step_sync = cloud.split("func syncSteps(date: Date, steps: Int)", 1)[1].split("func syncActiveEnergy", 1)[0]
          energy_sync = cloud.split("func syncActiveEnergy", 1)[1].split("func syncMotionDailySteps", 1)[0]
          motion_sync = cloud.split("func syncMotionDailySteps", 1)[1].split("private func performStepSync", 1)[0]
          start_activity = view.split("private func startActivitySession()", 1)[1].split("private func finishActivitySession()", 1)[0]
          daily_display = view.split("private var displayedDailySteps", 1)[1].split("private var displayedStepSource", 1)[0]
          motion_monitor = view.split("private func startLiveMotionMonitor()", 1)[1].split("private func loadActivityHistory()", 1)[0]
          finish_activity = view.split("private func finishActivitySession()", 1)[1].split("/// Prefer HealthKit", 1)[0]
          auth_handler = gps.split("func locationManagerDidChangeAuthorization", 1)[1].split("func locationManager(", 1)[0]

          checks = {
              "Native daily total falls back to the live iPhone pedometer": "health.todaySteps ?? liveMotionSteps" in daily_display,
              "Core Motion authorization state is surfaced": "CMPedometer.authorizationStatus()" in motion_monitor and "Motion & Fitness access is denied" in motion_monitor,
              "Core Motion sensor errors are not silently discarded": "iPhone pedometer error:" in motion_monitor,
              "Core Motion live daily steps remain a separate sensor source": "self.liveMotionSteps = steps" in motion_monitor and "syncMotionDailySteps" in motion_monitor,
              "GPS activity starts even without pedometer": "routeRecorder.start(activity: selectedActivity)" in start_activity and start_activity.index("routeRecorder.start(activity: selectedActivity)") < start_activity.index("guard CMPedometer.isStepCountingAvailable()"),
              "GPS-only activity button remains enabled without pedometer": 'Button(selectedActivity == "Walking" ? "Start WalkOn" : "Start activity") { startActivitySession() }' in view and ".disabled(!CMPedometer.isStepCountingAvailable())" not in view,
              "GPS route is saved when pedometer is unavailable": "saveRecord(nil, nil)" in finish_activity or "saveRecord(nil,nil)" in finish_activity and "routePoints: routePoints" in finish_activity,
              "Completed activity is encoded before successful-save GPS draft clearing": "let encodedHistory = try JSONEncoder().encode(history)" in finish_activity and finish_activity.index("let encodedHistory = try JSONEncoder().encode(history)") < finish_activity.rindex("self.routeRecorder.clearDraft()"),
              "Failed local activity save preserves GPS draft": "Your GPS draft remains preserved" in finish_activity and "catch {" in finish_activity,
              "Corrupt activity history is never overwritten with an empty list": "Could not read existing activity history" in finish_activity and "existingData.map" in finish_activity,
              "Always permission enables background GPS during an active walk": "else if isRecording" in auth_handler and "manager.allowsBackgroundLocationUpdates = true" in auth_handler and "manager.showsBackgroundLocationIndicator = true" in auth_handler,
              "Active GPS updates resume after permission change": "manager.startUpdatingLocation()" in auth_handler,
              "Location downgrade removes background GPS claim": "manager.allowsBackgroundLocationUpdates = false" in auth_handler and "Allow Always location for background recording" in auth_handler,
              "GPS accuracy filter": "location.horizontalAccuracy <= 50" in gps,
              "GPS long-gap segmentation": "elapsed > 30" in gps,
              "GPS jump/speed rejection": "delta > 150 || speed > 8" in gps,
              "Backward-compatible route draft decoding": "decodeIfPresent(Bool.self, forKey: .breakBefore) ?? false" in gps,
              "iPhone GPS draft uses atomic Application Support file writes": "applicationSupportDirectory" in gps and "data.write(to: url, options: .atomic)" in gps,
              "Legacy UserDefaults GPS drafts migrate only after file write succeeds": "if fileData == nil, let legacyData, let url" in gps and "UserDefaults.standard.removeObject(forKey: draftKey)" in gps,
              "Unreadable iPhone GPS draft is preserved rather than silently discarded": "original data was preserved for recovery" in gps,
              "Route distance skips segment breaks": "!pair.1.breakBefore" in gps,
              "Cloud distance skips segment breaks": "if cloudPoints[index].breakBefore { continue }" in cloud,
              "Active walk keeps motion monitor in background": "sessionStarted == nil && !routeRecorder.isRecording" in view,
              "Prompt HealthKit background update requested": "frequency: .immediate" in health,
              "HealthKit step background cadence disclosed as hourly": "at most hourly" in health,
              "Apple Health imports daily step history, not only today's total": "HKStatisticsCollectionQuery" in health and "enumerateStatistics(from: start, to: end)" in health,
              "Apple Health history window is bounded to a safe range": "max(1, min(days, 365))" in health,
              "Missing HealthKit days are not fabricated as zero": "guard let quantity = statistics.sumQuantity() else { return }" in health,
              "HealthKit refresh clears stale today's value before querying": "self.todaySteps = nil" in health,
              "Active-energy query requires explicit HealthKit connection": "guard UserDefaults.standard.bool(forKey: connectionRequestedKey), isAvailable else" in health,
              "GPS route upload allows unknown steps without inventing zero": '"p_steps": steps.map { $0 as Any } ?? NSNull()' in cloud,
              "Sensor retry outbox is persisted on device": "healthOutboxKey" in cloud and "UserDefaults.standard.set(data, forKey: healthOutboxKey)" in cloud,
              "Sensor retry records are scoped to authenticated member ID": "currentUserID" in cloud and "ownerID" in outbox and "filter { $0.ownerID == ownerID }" in cloud,
              "HealthKit step write is queued before network request and acknowledged after success": "enqueueHealthSync(item)" in step_sync and step_sync.index("enqueueHealthSync(item)") < step_sync.index("performStepSync") and step_sync.index("performStepSync") < step_sync.index("acknowledgeHealthSync(item)"),
              "Active-energy write is queued before network request and acknowledged after success": "enqueueHealthSync(item)" in energy_sync and energy_sync.index("enqueueHealthSync(item)") < energy_sync.index("URLSession.shared.data") and energy_sync.index("URLSession.shared.data") < energy_sync.index("acknowledgeHealthSync(item)"),
              "Core Motion write is queued and acknowledged only after server success": "enqueueHealthSync(item)" in motion_sync and motion_sync.index("enqueueHealthSync(item)") < motion_sync.index("URLSession.shared.data") and motion_sync.index("URLSession.shared.data") < motion_sync.index("acknowledgeHealthSync(item)"),
              "Queued sensor writes retry after sign-in and on foreground": "await retryPendingHealthSyncs()" in cloud and "await cloud.retryPendingHealthSyncs()" in view,
              "Member can see pending sensor-sync count": "pendingHealthSyncCount" in cloud and "pendingHealthSyncCount" in view,
              "Pending sync count never exposes another account's queue": "items.filter { $0.ownerID == currentUserID }.count" in cloud,
              "Older sensor upload cannot acknowledge a newer queued value": "($0.id == item.id && $0.revisionID == item.revisionID)" in cloud,
              "GPS cloud distance skips discontinuous segments": "if cloudPoints[index].breakBefore { continue }" in cloud,
              "Database allows unknown route steps without writing zero": "alter column steps drop not null" in migration and "steps = coalesce(excluded.steps, public.walk_sessions.steps)" in migration,
          }
          for name, ok in checks.items():
              print(("PASS: " if ok else "FAIL: ") + name)
          if not all(checks.values()):
              raise SystemExit("Real-time tracking safeguard verification failed")
          PY

      - name: Build GATIVX for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/GATIVX-Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged permissions and HealthKit entitlements
        run: |
          APP="build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app"
          test -f "$APP/Info.plist"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path("build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app")
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          for key in (
              "NSHealthShareUsageDescription",
              "NSHealthUpdateUsageDescription",
              "NSMotionUsageDescription",
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          ):
              if not info.get(key):
                  raise SystemExit(f"Missing permission purpose string: {key}")
          if "location" not in info.get("UIBackgroundModes", []):
              raise SystemExit("Background location mode is missing")

          entitlements_path = Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "ios/GATIVX/GATIVX.entitlements"
          with entitlements_path.open("rb") as stream:
              entitlements = plistlib.load(stream)
          print("GATIVX source entitlements:", entitlements)
          if entitlements.get("com.apple.developer.healthkit") != True:
              raise SystemExit("HealthKit entitlement is missing")
          if entitlements.get("com.apple.developer.healthkit.background-delivery") != True:
              raise SystemExit("HealthKit background-delivery entitlement is missing")
          print("GATIVX permission strings and source entitlements validated")
          PY

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: GATIVX-iOS-Simulator
          path: build/GATIVX-Simulator/Build/Products/Debug-iphonesimulator/GATIVX.app
          if-no-files-found: error
      # This creates a device-targeted unsigned IPA. It is NOT installable until
      # a trusted sideloading tool signs it with the user's own Apple ID.
      - name: Build unsigned iPhone device app
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/GATIVX-Device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned iPhone IPA
        run: |
          APP="build/GATIVX-Device/Build/Products/Debug-iphoneos/GATIVX.app"
          test -d "$APP"
          mkdir -p build/GATIVX-IPA/Payload
          cp -R "$APP" build/GATIVX-IPA/Payload/GATIVX.app
          cd build/GATIVX-IPA
          /usr/bin/zip -qry ../GATIVX-unsigned.ipa Payload
          /usr/bin/unzip -t ../GATIVX-unsigned.ipa
          test -s ../GATIVX-unsigned.ipa

      - name: Upload unsigned iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: GATIVX-iPhone-unsigned-IPA
          path: build/GATIVX-unsigned.ipa
          if-no-files-found: error
