name: GATIVX Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/gativx-android.yml"
  push:
    branches: ["main", "feat/gativx/**"]
    paths:
      - "android/**"
      - ".github/workflows/gativx-android.yml"

permissions:
  contents: read

concurrency:
  group: gativx-android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 36 SDK components
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Run Android JVM unit tests
        run: gradle -p android :app:testDebugUnitTest
      - name: Summarize Android JVM unit-test counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("android/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          if not reports:
              raise SystemExit("No Android JVM JUnit XML reports were generated.")
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              root = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print(f"Android JVM tests: {totals['tests']} total, {totals['failures']} failures, {totals['errors']} errors, {totals['skipped']} skipped")
          if totals["tests"] < 1 or totals["failures"] or totals["errors"]:
              raise SystemExit("Android JVM regression test gate did not pass.")
          PY
      - name: Verify WalkOn GPS, privacy and cloud-sync safeguards
        run: python android/scripts/check-walkon.py
      - name: Build debug APK
        run: gradle -p android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GATIVX-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
