name: GATIVX Prior XCTest Result Analysis

on:
  push:
    branches:
      - audit/gativx-xcresult-diagnostics-20261126
    paths:
      - ".github/workflows/gativx-prior-xcresult.yml"
      - "scripts/export-xctest-diagnostics.sh"

permissions:
  actions: read
  contents: read

jobs:
  inspect-prior-failure:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Check out diagnostics exporter
        uses: actions/checkout@v7.0.1

      - name: Download the original failing XCTest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/prior-failing.xcresult
          curl --fail --location --retry 3 --retry-delay 2 \\
            -H "Authorization: Bearer $GH_TOKEN" \\
            -H "Accept: application/vnd.github+json" \\
            -H "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/15085985240/zip" \\
            --output build/prior-failing-xcresult.zip
          unzip -q build/prior-failing-xcresult.zip -d build/prior-failing.xcresult
          test -f build/prior-failing.xcresult/Info.plist

      - name: Export structured details from the original failure
        run: |
          bash -n scripts/export-xctest-diagnostics.sh
          bash scripts/export-xctest-diagnostics.sh \\
            build/prior-failing.xcresult build/prior-failing-diagnostics
          grep -F "PASS: test-summary" build/prior-failing-diagnostics/export-status.txt
          grep -F "PASS: test-tree" build/prior-failing-diagnostics/export-status.txt
          grep -F "PASS: profile-navigation-test-details" build/prior-failing-diagnostics/export-status.txt
          grep -F "PASS: profile-navigation-test-activities" build/prior-failing-diagnostics/export-status.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          output = Path("build/prior-failing-diagnostics")
          summary = json.loads((output / "summary.json").read_text())
          details = json.loads((output / "profile-navigation-test-details.json").read_text())
          assert summary.get("failedTests", 0) >= 1, "The selected prior run no longer contains a failed test."
          assert details.get("testResult") == "Failed", "The cumulative Profile navigation test was not reported as failed."
          print("Verified original failing result bundle:")
          print(f"  total={summary.get('totalTestCount')} passed={summary.get('passedTests')} failed={summary.get('failedTests')} skipped={summary.get('skippedTests')}")
          print(f"  test={details.get('testIdentifier')} result={details.get('testResult')} duration={details.get('duration')}")
          PY

      - name: Upload prior failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: GATIVX-Prior-Failing-XCTest-Diagnostics
          path: build/prior-failing-diagnostics
          if-no-files-found: error
          retention-days: 7
