name: GATIVX web release checks

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/check-web.mjs"
      - ".github/workflows/web-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate GATIVX web release
        run: node scripts/check-web.mjs
