name: GATIVX web release checks

on:
  push:
    branches: ["main", "gativx/dashboard-connected-data-v2", "fix/gativx/**"]
    paths:
      - "index.html"
      - "app-v2.html"
      - "sw.js"
      - "scripts/check-web.mjs"
      - "scripts/browser-smoke.mjs"
      - "gativx-design-c-review.html"
      - "gativx-logo.svg"
      - "scripts/design-review-smoke.mjs"
      - "GATIVX_DESIGN_C_REVIEW_README.md"
      - ".github/workflows/web-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app-v2.html"
      - "scripts/check-web.mjs"
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/web-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate GATIVX web release
        run: node scripts/check-web.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run mobile browser smoke test
        run: node scripts/browser-smoke.mjs
      - name: Run GATIVX Design C review navigation and screenshot checks
        run: node scripts/design-review-smoke.mjs
      - name: Upload GATIVX Design C review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: GATIVX-Design-C-Review-Screenshots
          path: artifacts/gativx-design-c-review/*.png
          if-no-files-found: error
          retention-days: 14
