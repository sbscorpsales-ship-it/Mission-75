name: GATIVX web release checks

on:
  push:
    branches: ["main", "gativx/dashboard-connected-data-v2"]
    paths:
      - "index.html"
      - "app-v2.html"
      - "sw.js"
      - "scripts/check-web.mjs"
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/web-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "app-v2.html"
      - "scripts/check-web.mjs"
      - "scripts/browser-smoke.mjs"
      - ".github/workflows/web-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate GATIVX web release
        run: node scripts/check-web.mjs
      - name: Install browser test runner
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke test
        run: node scripts/browser-smoke.mjs
