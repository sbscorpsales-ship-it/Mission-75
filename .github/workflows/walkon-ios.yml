name: WALKON iOS build

# Dedicated validation for the standalone WALKON native iOS target.
# Re-run against the latest recovery and HealthKit observer implementation.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/WALKON/**"
      - "ios/WALKONTests/**"
      - "ios/project.yml"
      - ".github/workflows/walkon-ios.yml"
  push:
    branches:
      - "walkon/**"
    paths:
      - "ios/WALKON/**"
      - "ios/WALKONTests/**"
      - "ios/project.yml"
      - ".github/workflows/walkon-ios.yml"

concurrency:
  group: walkon-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate WALKON project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Run WALKON unit tests on an available iPhone Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild \
            -project ios/WALKON.xcodeproj \
            -scheme WALKON \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -destination-timeout 120 \
            -configuration Debug \
            -derivedDataPath build/WALKON-Tests \
            -resultBundlePath build/WALKON-Tests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Export readable WALKON test summary
        if: always()
        run: |
          if [ -d build/WALKON-Tests.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/WALKON-Tests.xcresult --format json > build/WALKON-test-summary.json || true
            xcrun xcresulttool get test-results tests --path build/WALKON-Tests.xcresult --format json > build/WALKON-test-details.json || true
          fi

      - name: Upload WALKON test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WALKON-iOS-Test-Results
          path: |
            build/WALKON-Tests.xcresult
            build/WALKON-test-summary.json
            build/WALKON-test-details.json
          if-no-files-found: ignore

  compile-ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate WALKON project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Compile WALKON for generic iPhone device
        run: |
          xcodebuild \
            -project ios/WALKON.xcodeproj \
            -scheme WALKON \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/WALKON-Device \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compile WALKON for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/WALKON.xcodeproj \
            -scheme WALKON \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/WALKON-Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify iOS permissions and privacy declarations
        run: |
          APP="build/WALKON-Simulator/Build/Products/Debug-iphonesimulator/WALKON.app"
          test -f "$APP/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          app = Path("build/WALKON-Simulator/Build/Products/Debug-iphonesimulator/WALKON.app")
          with (app / "Info.plist").open("rb") as stream:
              info = plistlib.load(stream)
          required_usage = (
              "NSHealthShareUsageDescription",
              "NSMotionUsageDescription",
              "NSLocationWhenInUseUsageDescription",
              "NSLocationAlwaysAndWhenInUseUsageDescription",
          )
          for key in required_usage:
              if not info.get(key):
                  raise SystemExit(f"Missing Info.plist usage description: {key}")
          if "location" not in info.get("UIBackgroundModes", []):
              raise SystemExit("Background location mode is not enabled")

          with (app / "PrivacyInfo.xcprivacy").open("rb") as stream:
              privacy = plistlib.load(stream)
          accessed = privacy.get("NSPrivacyAccessedAPITypes", [])
          if not any(
              item.get("NSPrivacyAccessedAPIType") == "NSPrivacyAccessedAPICategoryUserDefaults"
              and "CA92.1" in item.get("NSPrivacyAccessedAPITypeReasons", [])
              for item in accessed
          ):
              raise SystemExit("Missing approved UserDefaults API reason")
          collected = {
              item.get("NSPrivacyCollectedDataType")
              for item in privacy.get("NSPrivacyCollectedDataTypes", [])
          }
          for data_type in (
              "NSPrivacyCollectedDataTypePreciseLocation",
              "NSPrivacyCollectedDataTypeHealth",
              "NSPrivacyCollectedDataTypeFitness",
          ):
              if data_type not in collected:
                  raise SystemExit(f"Missing privacy data declaration: {data_type}")
          print("Info.plist and privacy manifest validated")
          PY
          plutil -lint ios/WALKON/WALKON.entitlements
          grep -A1 '<key>com.apple.developer.healthkit</key>' ios/WALKON/WALKON.entitlements | grep -q '<true/>'
          grep -A1 '<key>com.apple.developer.healthkit.background-delivery</key>' ios/WALKON/WALKON.entitlements | grep -q '<true/>'

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: WALKON-iOS-Simulator
          path: build/WALKON-Simulator/Build/Products/Debug-iphonesimulator/WALKON.app
          if-no-files-found: error
