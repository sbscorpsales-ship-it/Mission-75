name: WALKON iOS CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/WALKON/**"
      - "ios/WALKONTests/**"
      - "ios/project.yml"
      - ".github/workflows/walkon-ios.yml"
  push:
    branches:
      - main
    paths:
      - "ios/WALKON/**"
      - "ios/WALKONTests/**"
      - "ios/project.yml"
      - ".github/workflows/walkon-ios.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 26 and show version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate WALKON project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Validate project and test scheme
        run: xcodebuild -list -project ios/WALKON.xcodeproj

      - name: Build WALKON for iPhone Simulator
        run: |
          xcodebuild \
            -project ios/WALKON.xcodeproj \
            -scheme WALKON \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/WALKON-Simulator \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify packaged HealthKit purpose strings and source entitlements
        run: |
          APP=build/WALKON-Simulator/Build/Products/Debug-iphonesimulator/WALKON.app
          plutil -extract NSHealthShareUsageDescription raw -o - "$APP/Info.plist"
          plutil -extract NSHealthUpdateUsageDescription raw -o - "$APP/Info.plist"
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          entitlement_file = Path(os.environ["GITHUB_WORKSPACE"]) / "ios/WALKON/WALKON.entitlements"
          with entitlement_file.open("rb") as stream:
              entitlements = plistlib.load(stream)
          for key in ("com.apple.developer.healthkit", "com.apple.developer.healthkit.background-delivery"):
              if entitlements.get(key) != True:
                  raise SystemExit(f"Missing or disabled WALKON entitlement: {key}")
          print("WALKON HealthKit entitlements validated")
          PY

      - name: Run WALKON unit tests
        run: |
          xcodebuild \
            -project ios/WALKON.xcodeproj \
            -scheme WALKON \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath build/WALKON-Tests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: WALKON-iOS-Simulator
          path: build/WALKON-Simulator/Build/Products/Debug-iphonesimulator/WALKON.app
          if-no-files-found: error
