name: GATIVX database security checks

on:
  push:
    branches:
      - "fix/gativx-daily-action-progress-grants-20261126"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/gativx-database-security.yml"

permissions:
  contents: read

jobs:
  daily-action-progress-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gativx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gativx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Prepare minimal Supabase auth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gativx_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE ROLE supabase_admin NOLOGIN;
          CREATE ROLE untrusted_client NOLOGIN;
          CREATE SCHEMA storage;
          CREATE SCHEMA graphql;
          GRANT USAGE, CREATE ON SCHEMA public TO supabase_admin;
          GRANT USAGE, CREATE ON SCHEMA graphql TO supabase_admin;

          -- Reproduce the broad defaults observed in mission75-cloud so the
          -- regression test proves that the migration removes them.
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres
            GRANT EXECUTE ON FUNCTIONS TO PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA storage
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;

          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public
            GRANT ALL ON TABLES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public
            GRANT ALL ON SEQUENCES TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin
            GRANT EXECUTE ON FUNCTIONS TO PUBLIC;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA graphql
            GRANT EXECUTE ON FUNCTIONS TO anon, authenticated, service_role;

          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $function$
            SELECT NULLIF(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $function$;
          SQL

      - name: Apply daily action progress migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gativx_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261126012000_harden_daily_action_progress_privileges.sql

      - name: Harden public default privileges
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gativx_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261126071600_harden_public_default_privileges.sql

      - name: Verify future public object defaults
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gativx_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/public_default_privileges_security.sql

      - name: Verify grants and member isolation
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d gativx_test -v ON_ERROR_STOP=1 \
            -f supabase/tests/daily_action_progress_security.sql
