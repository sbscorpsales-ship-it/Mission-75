name: GATIVX iOS build check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Compile for iPhone Simulator (no signing)
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath "$RUNNER_TEMP/GATIVXDerivedData" \
            build

      - name: Verify generated iOS privacy strings and HealthKit entitlements
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GATIVXDerivedData/Build/Products/Debug-iphonesimulator/GATIVX.app"
          INFO="$APP/Info.plist"
          test -f "$INFO"
          for KEY in NSHealthShareUsageDescription NSMotionUsageDescription NSLocationWhenInUseUsageDescription; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$INFO")
            test -n "$VALUE"
            echo "$KEY: present"
          done
          plutil -lint ios/GATIVX/GATIVX.entitlements
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit' ios/GATIVX/GATIVX.entitlements | grep -qx true
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.healthkit.background-delivery' ios/GATIVX/GATIVX.entitlements | grep -qx true
          echo 'HealthKit entitlement declarations: present'
