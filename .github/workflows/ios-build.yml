name: GATIVX iOS build check

on:
  workflow_dispatch:
  push:
    branches:
      - "gativx/ios-healthkit-mainline-2026-11-06"
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Xcode and XcodeGen versions
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        working-directory: ios
        run: |
          pwd
          find GATIVX -type f -maxdepth 4 -print
          xcodegen generate --spec project.yml
          test -d GATIVX.xcodeproj
      - name: Compile for iPhone Simulator (no signing)
        run: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload simulator app bundle
        uses: actions/upload-artifact@v4
        with:
          name: GATIVX-iOS-Simulator
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/GATIVX.app
          if-no-files-found: error
