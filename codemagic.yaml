workflows:
  gativx-ios-simulator:
    name: GATIVX iOS - Compile Check
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.4
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate --spec project.yml
      - name: Compile for iOS Simulator
        script: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log
