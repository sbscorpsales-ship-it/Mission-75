workflows:
  gativx-ios-simulator:
    name: GATIVX iOS Simulator Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "gativx/session-step-sync-v1"
          include: true
          source: true
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
      - name: Generate Xcode project
        script: |
          cd ios
          xcodegen generate --spec project.yml
      - name: Build GATIVX for iPhone Simulator
        script: |
          xcodebuild \
            -project ios/GATIVX.xcodeproj \
            -scheme GATIVX \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app
      - build/ios/Build/Products/Debug-iphonesimulator/*.dSYM
